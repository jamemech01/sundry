name: sundry

services:
  postgres:
    image: postgres:16
    container_name: sundry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sundry
      POSTGRES_PASSWORD: sundry
      POSTGRES_DB: sundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
