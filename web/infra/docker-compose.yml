
name: sundry

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sundry-web:dev
    restart: always
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      PORT: 4000
      API_URL: http://gateway:3000
    ports:
      - "4000:4000"
    volumes:
      - ..:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    networks:
      - sundry_default

volumes:
  web_node_modules:
  web_next:

networks:
  sundry_default:
    external: true
